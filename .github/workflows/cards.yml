name: Cards

# Counts stars and language shares of my projects and redraws the README cards.
# Runs every night, after a change of texts or of the drawing script, and by hand.
on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [master]
    paths: [cards/data.json, scripts/cards.py, .github/workflows/cards.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Liberation Sans and DejaVu Sans Mono match Helvetica and Menlo in width, so the cards wrap as on a Mac.
      - run: sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core > /dev/null
      - run: pip install --quiet pillow==11.0.0
      - run: python3 scripts/cards.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit if anything changed
        run: |
          git add -A cards README.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update project stars and languages"
          git push
